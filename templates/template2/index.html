<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{name}} – Portfolio</title>
  <meta name="description" content="{{headline}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Injected JSON data with safe fallback -->
  <script id="portfolio-data" type="application/json">
{{DATA_JSON}}
  </script>

  <script>
    let INJECTED_DATA = null;
    try {
      const dataTag = document.getElementById('portfolio-data');
      const rawText = dataTag ? dataTag.textContent.trim() : '';
      if (rawText && !rawText.includes('{{DATA_JSON}}') && !rawText.startsWith('{{')) {
        INJECTED_DATA = JSON.parse(rawText);
      }
    } catch (e) {
      console.warn('Using default demo data:', e);
      INJECTED_DATA = null;
    }

    const DEFAULT_DATA = {
      name: "Elena Marsh",
      headline: "Senior UI & UX Designer",
      about: "Product designer with 6+ years of experience leading design systems and user-centric web applications. Obsessed with micro-interactions, accessibility, and high conversion interfaces.",
      contact: {
        location: "Brooklyn, NYC",
        email: "elena@example.com",
        phone: "+1 (555) 789-0123"
      },
      links: {
        github: "https://github.com",
        linkedin: "https://linkedin.com",
        website: "https://example.com"
      },
      skills: ["Figma", "UI/UX Design", "Design Systems", "Prototyping", "User Research", "Tailwind CSS", "React", "HTML/CSS"],
      experience: [
        {
          company: "Tailwind Labs",
          role: "Senior Product Designer",
          start: "2022",
          end: "Present",
          description: "Led end-to-end redesign of dashboard UI, improving user retention by 23%. Collaborated closely with frontend engineers to ship new tokens."
        },
        {
          company: "Asana",
          role: "UI/UX Designer",
          start: "2019",
          end: "2022",
          description: "Created scalable design systems for enterprise workflows across finance and productivity products."
        }
      ],
      education: [
        {
          school: "Pratt Institute — Brooklyn, NY",
          degree: "B.F.A. in Graphic Design",
          start: "2015",
          end: "2019"
        }
      ],
      projects: [
        {
          name: "Wellnest Health Platform",
          description: "Comprehensive telemedicine dashboard and patient portal designed for clarity and fast appointment booking.",
          url: "https://github.com",
          tech: ["Figma", "Design Systems", "Tailwind"]
        },
        {
          name: "ScoutHire Talent Engine",
          description: "AI-assisted technical recruiting pipeline interface connecting high-growth startups with senior talent.",
          url: "https://github.com",
          tech: ["React", "UI/UX", "Next.js"]
        }
      ],
      sections: {
        showProjects: true,
        showEducation: true,
        showExperience: true,
        showSkills: true
      }
    };

    function normalizeData(raw) {
      if (!raw) return DEFAULT_DATA;
      return {
        name: raw.name || raw.hero?.name || DEFAULT_DATA.name,
        headline: raw.headline || raw.hero?.headline || DEFAULT_DATA.headline,
        about: raw.about?.summary || (typeof raw.about === 'string' ? raw.about : DEFAULT_DATA.about),
        avatarUrl: raw.avatarUrl || raw.photo || raw.image || (raw.profile && raw.profile.avatarUrl) || '',
        contact: {
          location: raw.contact?.location || '',
          email: raw.contact?.email || '',
          phone: raw.contact?.phone || ''
        },
        links: {
          github: raw.links?.github || raw.contact?.links?.github || '',
          linkedin: raw.links?.linkedin || raw.contact?.links?.linkedin || '',
          website: raw.links?.website || raw.contact?.links?.website || ''
        },
        skills: Array.isArray(raw.skills) ? (typeof raw.skills[0] === 'string' ? raw.skills : raw.skills.flatMap(c => c.items || [])) : DEFAULT_DATA.skills,
        experience: Array.isArray(raw.experience) ? raw.experience : DEFAULT_DATA.experience,
        education: Array.isArray(raw.education) ? raw.education : DEFAULT_DATA.education,
        projects: Array.isArray(raw.projects) ? raw.projects : DEFAULT_DATA.projects,
        sections: {
          showProjects: raw.sections?.showProjects ?? true,
          showEducation: raw.sections?.showEducation ?? true,
          showExperience: raw.sections?.showExperience ?? true,
          showSkills: raw.sections?.showSkills ?? true
        }
      };
    }

    const DATA = normalizeData(INJECTED_DATA);

    function el(tag, attrs, ...children) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') e.className = v;
        else if (k === 'href') e.href = v;
        else if (k === 'target') e.target = v;
        else if (k === 'src') e.src = v;
        else if (k === 'alt') e.alt = v;
        else e.setAttribute(k, v);
      }
      for (const c of children) {
        if (!c) continue;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }

    function renderNav() {
      return el('nav', { class: 'top-nav' },
        el('div', { class: 'container nav-inner' },
          el('a', { href: '#', class: 'nav-brand' }, DATA.name),
          el('ul', { class: 'nav-links' },
            el('li', {}, el('a', { href: '#about', class: 'nav-link' }, 'About')),
            el('li', {}, el('a', { href: '#work', class: 'nav-link' }, 'Work')),
            el('li', {}, el('a', { href: '#experience', class: 'nav-link' }, 'Experience')),
            el('li', {}, el('a', { href: '#contact', class: 'nav-link' }, 'Contact'))
          )
        )
      );
    }

    function renderHero() {
      const socialLinks = [];
      if (DATA.links.github) {
        socialLinks.push(
          el('a', { href: DATA.links.github, target: '_blank', class: 'social-circle-link' },
            el('img', { src: 'images/icon/twitter-icon.svg', alt: 'GitHub', style: 'width: 18px; height: 18px;' })
          )
        );
      }
      if (DATA.links.linkedin) {
        socialLinks.push(
          el('a', { href: DATA.links.linkedin, target: '_blank', class: 'social-circle-link' },
            el('img', { src: 'images/icon/dribble-icon.svg', alt: 'LinkedIn', style: 'width: 18px; height: 18px;' })
          )
        );
      }
      if (DATA.links.website) {
        socialLinks.push(
          el('a', { href: DATA.links.website, target: '_blank', class: 'social-circle-link' },
            el('img', { src: 'images/icon/behance-icon.svg', alt: 'Website', style: 'width: 18px; height: 18px;' })
          )
        );
      }

      return el('header', {},
        el('div', { class: 'container' },
          el('div', { class: 'border-frame' },
            // Banner image
            el('div', { class: 'hero-banner-wrap' },
              el('img', { src: 'images/hero-sec/banner-bg-img.png', alt: 'Banner', class: 'hero-banner-img' })
            ),
            // Profile bar
            el('div', { class: 'hero-profile-bar' },
              el('div', { class: 'avatar-wrapper' },
                el('img', { src: DATA.avatarUrl || 'images/hero-sec/user-img.png', alt: DATA.name, class: 'user-avatar' }),
                el('span', { class: 'online-dot' })
              ),
              el('div', { class: 'profile-info' },
                el('h1', { class: 'profile-name' }, DATA.name),
                el('p', { class: 'profile-headline' }, DATA.headline),
                DATA.contact.location ? el('div', { class: 'profile-location' },
                  el('img', { src: 'images/icon/map-icon.svg', alt: 'Location', style: 'width: 16px; height: 16px;' }),
                  el('span', {}, DATA.contact.location)
                ) : null
              ),
              el('div', { class: 'profile-actions' },
                socialLinks.length ? el('div', { style: 'display: flex; gap: 0.5rem;' }, ...socialLinks) : null,
                el('div', { class: 'gradient-btn-wrap' },
                  el('a', { href: '#contact', class: 'gradient-btn' },
                    el('img', { src: 'images/icon/spark-icon.svg', alt: 'Spark', style: 'width: 14px; height: 14px;' }),
                    el('span', {}, 'Get in touch')
                  )
                )
              )
            )
          )
        )
      );
    }

    function renderAbout() {
      return el('section', { id: 'about' },
        el('div', { class: 'container' },
          el('div', { class: 'border-frame divider' },
            el('div', { class: 'section-intro-bar' },
              el('span', { class: 'section-label' }, 'About Me')
            ),
            el('div', { class: 'about-box' },
              el('p', { class: 'about-text' }, DATA.about)
            )
          )
        )
      );
    }

    function renderWork() {
      if (!DATA.sections.showProjects || !DATA.projects.length) return null;

      const fallbackThumbs = [
        'images/feature-work/feature-img-1.png',
        'images/feature-work/feature-img-2.png'
      ];

      const items = DATA.projects.map((proj, idx) => {
        const thumb = fallbackThumbs[idx % fallbackThumbs.length];
        const tags = (proj.tech || []).map(t => el('span', { class: 'tag-pill' }, t));

        return el('div', { class: 'work-item' },
          el('div', { class: 'work-thumb-wrap' },
            el('img', { src: thumb, alt: proj.name, class: 'work-thumb' })
          ),
          el('div', { class: 'work-info' },
            el('h3', { class: 'work-title' },
              proj.url ? el('a', { href: proj.url, target: '_blank' }, proj.name + ' ↗') : proj.name
            ),
            el('p', { class: 'work-desc' }, proj.description),
            tags.length ? el('div', { class: 'work-tags' }, ...tags) : null
          )
        );
      });

      return el('section', { id: 'work' },
        el('div', { class: 'container' },
          el('div', { class: 'border-frame divider' },
            el('div', { class: 'section-intro-bar' },
              el('span', { class: 'section-label' }, 'Featured Work')
            ),
            el('div', { class: 'work-grid' }, ...items)
          )
        )
      );
    }

    function renderExperience() {
      if (!DATA.sections.showExperience || !DATA.experience.length) return null;

      const icons = [
        'images/icon/tailwind-icon.svg',
        'images/icon/asana-icon.svg'
      ];

      const items = DATA.experience.map((exp, idx) => {
        const iconSrc = icons[idx % icons.length];
        return el('div', { class: 'timeline-row' },
          el('div', { class: 'company-icon-chip' },
            el('img', { src: iconSrc, alt: exp.company, style: 'width: 24px; height: 24px;' })
          ),
          el('div', { class: 'timeline-details' },
            el('div', { class: 'timeline-title-row' },
              el('h4', { class: 'role-title' }, exp.role),
              el('span', { class: 'date-badge' }, (exp.start || '') + (exp.start && exp.end ? ' – ' : '') + (exp.end || 'Present'))
            ),
            el('span', { class: 'company-name' }, exp.company),
            el('p', { class: 'timeline-desc' }, exp.description)
          )
        );
      });

      return el('section', { id: 'experience' },
        el('div', { class: 'container' },
          el('div', { class: 'border-frame divider' },
            el('div', { class: 'section-intro-bar' },
              el('span', { class: 'section-label' }, 'Experience')
            ),
            el('div', { class: 'timeline-section' },
              el('div', { class: 'timeline-list' }, ...items)
            )
          )
        )
      );
    }

    function renderSkills() {
      if (!DATA.sections.showSkills || !DATA.skills.length) return null;

      const chips = DATA.skills.map(s => el('span', { class: 'skill-chip' }, s));

      return el('section', { id: 'skills' },
        el('div', { class: 'container' },
          el('div', { class: 'border-frame divider' },
            el('div', { class: 'section-intro-bar' },
              el('span', { class: 'section-label' }, 'Skills & Tools')
            ),
            el('div', { class: 'skills-box' }, ...chips)
          )
        )
      );
    }

    function renderContact() {
      return el('section', { id: 'contact' },
        el('div', { class: 'container' },
          el('div', { class: 'border-frame divider' },
            el('div', { class: 'section-intro-bar' },
              el('span', { class: 'section-label' }, 'Contact')
            ),
            el('div', { class: 'about-box', style: 'text-align: center; padding: 2rem 1.75rem 4rem;' },
              el('h2', { style: 'font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem;' }, 'Let us build something remarkable'),
              el('p', { style: 'color: var(--secondary); max-width: 500px; margin: 0 auto 1.75rem;' },
                'Open to full-time opportunities, design consulting, and high-impact engineering leadership.'
              ),
              DATA.contact.email ? el('div', { class: 'gradient-btn-wrap' },
                el('a', { href: `mailto:${DATA.contact.email}`, class: 'gradient-btn' },
                  el('span', {}, `✉ ${DATA.contact.email}`)
                )
              ) : null
            )
          )
        )
      );
    }

    function renderFooter() {
      return el('footer', { class: 'footer' },
        el('div', { class: 'container footer-inner' },
          el('div', {}, `© ${new Date().getFullYear()} ${DATA.name}`),
          el('div', {}, 'Built with Typefolio editorial template.')
        )
      );
    }

    function render() {
      const app = document.getElementById('app');
      app.appendChild(renderNav());
      app.appendChild(renderHero());
      app.appendChild(renderAbout());

      const work = renderWork();
      if (work) app.appendChild(work);

      const exp = renderExperience();
      if (exp) app.appendChild(exp);

      const sk = renderSkills();
      if (sk) app.appendChild(sk);

      app.appendChild(renderContact());
      app.appendChild(renderFooter());
    }

    render();

    // Smooth In-Page Anchor Navigation
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const id = this.getAttribute('href').slice(1);
        if (!id) return;
        const target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (history.pushState) history.pushState(null, '', '#' + id);
        }
      });
    });
  </script>
</body>
</html>
