<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{name}} – Portfolio</title>
  <meta name="description" content="{{headline}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Injected by template service or fallback to default sample portfolio -->
  <script id="portfolio-data" type="application/json">
{{DATA_JSON}}
  </script>

  <script>
    let INJECTED_DATA = null;
    try {
      const dataTag = document.getElementById('portfolio-data');
      const rawText = dataTag ? dataTag.textContent.trim() : '';
      if (rawText && !rawText.includes('{{DATA_JSON}}') && !rawText.startsWith('{{')) {
        INJECTED_DATA = JSON.parse(rawText);
      }
    } catch (e) {
      console.warn('Using default demo data:', e);
      INJECTED_DATA = null;
    }

    const DEFAULT_DATA = {
      name: "Taylor Reed",
      headline: "Full-Stack Engineer & Product Builder",
      about: "I build fast, resilient web applications with crisp design systems and rock-solid architecture. Passionate about TypeScript, modern cloud infrastructure, and software that users actually love using.",
      contact: {
        location: "San Francisco, CA",
        email: "taylor@example.com",
        phone: "+1 (555) 234-5678"
      },
      links: {
        github: "https://github.com",
        linkedin: "https://linkedin.com",
        website: "https://example.com"
      },
      skills: ["TypeScript", "React", "Next.js", "Node.js", "PostgreSQL", "Docker", "GraphQL", "Tailwind CSS"],
      experience: [
        {
          company: "Acme Cloud",
          role: "Staff Engineer",
          start: "2022",
          end: "Present",
          description: "Architected edge caching layer reducing median P99 latency by 38% across 100M+ monthly requests."
        }
      ],
      education: [
        {
          school: "UC Berkeley",
          degree: "B.S. Computer Science",
          start: "2018",
          end: "2022"
        }
      ],
      projects: [
        {
          name: "Turbopack Edge Analytics",
          description: "Real-time telemetry and distributed tracing dashboard built on top of Cloudflare D1 and WebSockets.",
          url: "https://github.com",
          tech: ["React", "TypeScript", "Tailwind"]
        }
      ],
      sections: {
        showProjects: true,
        showEducation: true,
        showExperience: true,
        showSkills: true
      }
    };

    function normalizeData(raw) {
      if (!raw) return DEFAULT_DATA;
      return {
        name: raw.name || raw.hero?.name || DEFAULT_DATA.name,
        headline: raw.headline || raw.hero?.headline || DEFAULT_DATA.headline,
        about: raw.about?.summary || (typeof raw.about === 'string' ? raw.about : DEFAULT_DATA.about),
        avatarUrl: raw.avatarUrl || raw.photo || raw.image || (raw.profile && raw.profile.avatarUrl) || '',
        contact: {
          location: raw.contact?.location || '',
          email: raw.contact?.email || '',
          phone: raw.contact?.phone || ''
        },
        links: {
          github: raw.links?.github || raw.contact?.links?.github || '',
          linkedin: raw.links?.linkedin || raw.contact?.links?.linkedin || '',
          website: raw.links?.website || raw.contact?.links?.website || ''
        },
        skills: Array.isArray(raw.skills) ? (typeof raw.skills[0] === 'string' ? raw.skills : raw.skills.flatMap(c => c.items || [])) : DEFAULT_DATA.skills,
        experience: Array.isArray(raw.experience) ? raw.experience : DEFAULT_DATA.experience,
        education: Array.isArray(raw.education) ? raw.education : DEFAULT_DATA.education,
        projects: Array.isArray(raw.projects) ? raw.projects : DEFAULT_DATA.projects,
        sections: {
          showProjects: raw.sections?.showProjects ?? true,
          showEducation: raw.sections?.showEducation ?? true,
          showExperience: raw.sections?.showExperience ?? true,
          showSkills: raw.sections?.showSkills ?? true
        }
      };
    }

    const DATA = normalizeData(INJECTED_DATA);

    function el(tag, attrs, ...children) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') e.className = v;
        else if (k === 'href') e.href = v;
        else if (k === 'target') e.target = v;
        else if (k === 'src') e.src = v;
        else if (k === 'alt') e.alt = v;
        else e.setAttribute(k, v);
      }
      for (const c of children) {
        if (!c) continue;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }

    function badge(text) {
      return el('span', { class: 'badge' }, text);
    }

    function link(href, text) {
      if (!href) return null;
      return el('a', { href, target: '_blank', class: 'text-link' }, text);
    }

    function section(id, title, ...children) {
      return el('section', { id, class: 'section' },
        el('h2', { class: 'section-title' }, title),
        el('div', { class: 'section-body' }, ...children)
      );
    }

    function renderHeader() {
      const { name, headline, contact, links, avatarUrl } = DATA;
      const linkEls = [
        links.github ? link(links.github, '↗ GitHub') : null,
        links.linkedin ? link(links.linkedin, '↗ LinkedIn') : null,
        links.website ? link(links.website, '↗ Website') : null,
      ].filter(Boolean);

      return el('header', { class: 'hero' },
        el('div', { class: 'hero-inner' },
          avatarUrl ? el('div', { class: 'hero-avatar-wrap' },
            el('img', { src: avatarUrl, alt: name, class: 'hero-avatar-img' })
          ) : null,
          el('h1', { class: 'hero-name' }, name),
          el('p', { class: 'hero-headline' }, headline),
          el('div', { class: 'hero-meta' },
            contact.location ? el('span', { class: 'meta-item' }, '📍 ' + contact.location) : null,
            contact.email ? el('a', { href: 'mailto:' + contact.email, class: 'meta-item meta-link' }, '✉ ' + contact.email) : null,
            contact.phone ? el('span', { class: 'meta-item' }, '📞 ' + contact.phone) : null,
          ),
          linkEls.length ? el('div', { class: 'hero-links' }, ...linkEls) : null,
        )
      );
    }

    function renderAbout() {
      return section('about', 'About',
        el('p', { class: 'about-text' }, DATA.about)
      );
    }

    function renderSkills() {
      if (!DATA.sections.showSkills || !DATA.skills.length) return null;
      return section('skills', 'Skills',
        el('div', { class: 'badges' }, ...DATA.skills.map(badge))
      );
    }

    function renderExperience() {
      if (!DATA.sections.showExperience || !DATA.experience.length) return null;
      const items = DATA.experience.map(exp =>
        el('div', { class: 'card' },
          el('div', { class: 'card-header' },
            el('div', {},
              el('div', { class: 'card-title' }, exp.role),
              el('div', { class: 'card-subtitle' }, exp.company),
            ),
            el('span', { class: 'card-date' }, (exp.start || '') + (exp.start && exp.end ? ' – ' : '') + (exp.end || 'Present')),
          ),
          el('p', { class: 'card-body' }, exp.description),
        )
      );
      return section('experience', 'Experience', ...items);
    }

    function renderProjects() {
      if (!DATA.sections.showProjects || !DATA.projects.length) return null;
      const items = DATA.projects.map(p =>
        el('div', { class: 'card' },
          el('div', { class: 'card-header' },
            el('div', { class: 'card-title' },
              p.url ? link(p.url, p.name + ' ↗') : p.name
            ),
            p.tech ? el('div', { class: 'badges badges-sm' }, ...p.tech.map(badge)) : null,
          ),
          el('p', { class: 'card-body' }, p.description),
        )
      );
      return section('projects', 'Projects', ...items);
    }

    function renderEducation() {
      if (!DATA.sections.showEducation || !DATA.education.length) return null;
      const items = DATA.education.map(edu =>
        el('div', { class: 'card' },
          el('div', { class: 'card-header' },
            el('div', {},
              el('div', { class: 'card-title' }, edu.degree),
              el('div', { class: 'card-subtitle' }, edu.school),
            ),
            edu.end ? el('span', { class: 'card-date' }, (edu.start || '') + (edu.start ? ' – ' : '') + edu.end) : null,
          ),
        )
      );
      return section('education', 'Education', ...items);
    }

    function render() {
      const app = document.getElementById('app');
      const main = el('main', { class: 'container' },
        renderAbout(),
        renderSkills(),
        renderExperience(),
        renderProjects(),
        renderEducation(),
      );
      app.appendChild(renderHeader());
      app.appendChild(main);
    }

    render();

    // Smooth In-Page Anchor Navigation
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const id = this.getAttribute('href').slice(1);
        if (!id) return;
        const target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (history.pushState) history.pushState(null, '', '#' + id);
        }
      });
    });
  </script>
</body>
</html>
