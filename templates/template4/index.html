<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{name}} – Portfolio</title>
  <meta name="description" content="{{headline}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Injected JSON data with safe fallback -->
  <script id="portfolio-data" type="application/json">
{{DATA_JSON}}
  </script>

  <script>
    let INJECTED_DATA = null;
    try {
      const dataTag = document.getElementById('portfolio-data');
      const rawText = dataTag ? dataTag.textContent.trim() : '';
      if (rawText && !rawText.includes('{{DATA_JSON}}') && !rawText.startsWith('{{')) {
        INJECTED_DATA = JSON.parse(rawText);
      }
    } catch (e) {
      console.warn('Using default demo data:', e);
      INJECTED_DATA = null;
    }

    const DEFAULT_DATA = {
      name: "Alex Vance",
      headline: "Full-Stack Software Engineer",
      about: "Transforming complex challenges into interactive, resilient, and seamless digital products with cutting-edge frontend architecture and distributed backend services.",
      contact: {
        location: "Seattle, WA",
        email: "alex@example.com",
        phone: "+1 (555) 345-6789"
      },
      links: {
        github: "https://github.com",
        linkedin: "https://linkedin.com",
        website: "https://example.com"
      },
      skills: ["TypeScript", "React", "Next.js", "Node.js", "PostgreSQL", "Docker", "AWS", "GraphQL", "Tailwind CSS", "Rust", "Redis", "Figma"],
      experience: [
        {
          company: "NovaScale Cloud",
          role: "Senior Distributed Systems Engineer",
          start: "2023",
          end: "Present",
          description: "Engineered scalable telemetry pipelines handling 2.4B events monthly with sub-second dashboard rendering."
        },
        {
          company: "Aetheric Labs",
          role: "Frontend Engineer",
          start: "2020",
          end: "2023",
          description: "Built accessible, high-performance web applications and internal design systems across core product surfaces."
        }
      ],
      education: [
        {
          school: "University of Washington",
          degree: "B.S. in Computer Science",
          start: "2016",
          end: "2020"
        }
      ],
      projects: [
        {
          name: "Synapse Dashboard",
          description: "Real-time edge analytics portal with optimistic UI updates and instant query federation.",
          url: "https://github.com",
          tech: ["React", "TypeScript", "Tailwind", "WebSockets"]
        },
        {
          name: "KubePilot CLI",
          description: "Developer CLI and daemon for ephemeral testing environments and zero-friction cluster provisioning.",
          url: "https://github.com",
          tech: ["Go", "Docker", "Kubernetes"]
        }
      ],
      sections: {
        showProjects: true,
        showEducation: true,
        showExperience: true,
        showSkills: true
      }
    };

    function normalizeData(raw) {
      if (!raw) return DEFAULT_DATA;
      return {
        name: raw.name || raw.hero?.name || DEFAULT_DATA.name,
        headline: raw.headline || raw.hero?.headline || DEFAULT_DATA.headline,
        about: raw.about?.summary || (typeof raw.about === 'string' ? raw.about : DEFAULT_DATA.about),
        avatarUrl: raw.avatarUrl || raw.photo || raw.image || (raw.profile && raw.profile.avatarUrl) || '',
        contact: {
          location: raw.contact?.location || '',
          email: raw.contact?.email || '',
          phone: raw.contact?.phone || ''
        },
        links: {
          github: raw.links?.github || raw.contact?.links?.github || '',
          linkedin: raw.links?.linkedin || raw.contact?.links?.linkedin || '',
          website: raw.links?.website || raw.contact?.links?.website || ''
        },
        skills: Array.isArray(raw.skills) ? (typeof raw.skills[0] === 'string' ? raw.skills : raw.skills.flatMap(c => c.items || [])) : DEFAULT_DATA.skills,
        experience: Array.isArray(raw.experience) ? raw.experience : DEFAULT_DATA.experience,
        education: Array.isArray(raw.education) ? raw.education : DEFAULT_DATA.education,
        projects: Array.isArray(raw.projects) ? raw.projects : DEFAULT_DATA.projects,
        sections: {
          showProjects: raw.sections?.showProjects ?? true,
          showEducation: raw.sections?.showEducation ?? true,
          showExperience: raw.sections?.showExperience ?? true,
          showSkills: raw.sections?.showSkills ?? true
        }
      };
    }

    const DATA = normalizeData(INJECTED_DATA);

    function el(tag, attrs, ...children) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') e.className = v;
        else if (k === 'href') e.href = v;
        else if (k === 'target') e.target = v;
        else e.setAttribute(k, v);
      }
      for (const c of children) {
        if (!c) continue;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }

    function renderNav() {
      return el('nav', { class: 'dark-nav' },
        el('div', { class: 'wrap dark-nav-inner' },
          el('a', { href: '#', class: 'dark-brand' }, DATA.name),
          el('ul', { class: 'dark-nav-links' },
            el('li', {}, el('a', { href: '#projects', class: 'dark-nav-link' }, 'Projects')),
            el('li', {}, el('a', { href: '#experience', class: 'dark-nav-link' }, 'Experience')),
            el('li', {}, el('a', { href: '#skills', class: 'dark-nav-link' }, 'Skills')),
            el('li', {}, el('a', { href: '#contact', class: 'dark-nav-link' }, 'Contact'))
          )
        )
      );
    }

    function renderHero() {
      const socialButtons = [];
      if (DATA.links.github) {
        socialButtons.push(
          el('a', { href: DATA.links.github, target: '_blank', class: 'glass-icon-btn' }, '↗ GitHub')
        );
      }
      if (DATA.links.linkedin) {
        socialButtons.push(
          el('a', { href: DATA.links.linkedin, target: '_blank', class: 'glass-icon-btn' }, '↗ LinkedIn')
        );
      }
      if (DATA.contact.email) {
        socialButtons.push(
          el('a', { href: `mailto:${DATA.contact.email}`, class: 'glass-icon-btn' }, `✉ Contact Me`)
        );
      }

      return el('header', { class: 'hero-box' },
        el('div', { class: 'wrap' },
          DATA.avatarUrl ? el('div', { class: 'dark-avatar-wrap' },
            el('img', { src: DATA.avatarUrl, alt: DATA.name, class: 'dark-avatar-img' }),
            el('span', { class: 'dark-avatar-glow' })
          ) : null,
          el('p', { class: 'hero-greeting' }, `Hello, I'm ${DATA.name}`),
          el('h1', { class: 'hero-main-title' },
            DATA.headline.split(' ').map((word, i) =>
              i === 0 ? el('span', { class: 'hero-accent-text' }, word + ' ') : word + ' '
            )
          ),
          el('p', { class: 'hero-desc' }, DATA.about),
          socialButtons.length ? el('div', { class: 'hero-social-row' }, ...socialButtons) : null
        )
      );
    }

    function renderMarquee() {
      if (!DATA.sections.showSkills || !DATA.skills.length) return null;

      // Duplicate list for infinite smooth marquee
      const skillsRepeated = [...DATA.skills, ...DATA.skills];
      const items = skillsRepeated.map(s => el('div', { class: 'marquee-item' }, s));

      return el('div', { class: 'marquee-bar' },
        el('div', { class: 'marquee-content' }, ...items)
      );
    }

    function renderProjects() {
      if (!DATA.sections.showProjects || !DATA.projects.length) return null;

      const cards = DATA.projects.map(p => {
        const badges = (p.tech || []).map(t => el('span', { class: 'tech-badge' }, t));
        return el('div', { class: 'glass-project-card' },
          el('h3', { class: 'project-h3' },
            p.url ? el('a', { href: p.url, target: '_blank' }, p.name + ' ↗') : p.name
          ),
          el('p', { class: 'project-text' }, p.description),
          badges.length ? el('div', { class: 'project-pills' }, ...badges) : null
        );
      });

      return el('section', { id: 'projects', style: 'padding: 3rem 0;' },
        el('div', { class: 'wrap' },
          el('div', { class: 'section-heading-row' },
            el('h2', { class: 'section-h2' }, 'Featured Projects')
          ),
          el('div', { class: 'project-cards-grid' }, ...cards)
        )
      );
    }

    function renderExperience() {
      if (!DATA.sections.showExperience || !DATA.experience.length) return null;

      const items = DATA.experience.map(exp =>
        el('div', { class: 'timeline-glass-card' },
          el('div', { class: 'timeline-role-row' },
            el('h4', { class: 'exp-role' }, exp.role),
            el('span', { class: 'exp-date' }, (exp.start || '') + (exp.start && exp.end ? ' – ' : '') + (exp.end || 'Present'))
          ),
          el('div', { class: 'exp-company' }, exp.company),
          el('p', { class: 'exp-desc' }, exp.description)
        )
      );

      return el('section', { id: 'experience', style: 'padding: 3rem 0;' },
        el('div', { class: 'wrap' },
          el('div', { class: 'section-heading-row' },
            el('h2', { class: 'section-h2' }, 'Experience')
          ),
          el('div', { class: 'timeline-stack' }, ...items)
        )
      );
    }

    function renderEducation() {
      if (!DATA.sections.showEducation || !DATA.education.length) return null;

      const items = DATA.education.map(edu =>
        el('div', { class: 'timeline-glass-card' },
          el('div', { class: 'timeline-role-row' },
            el('h4', { class: 'exp-role' }, edu.degree),
            edu.end ? el('span', { class: 'exp-date' }, (edu.start ? edu.start + ' – ' : '') + edu.end) : null
          ),
          el('div', { class: 'exp-company' }, edu.school)
        )
      );

      return el('section', { id: 'education', style: 'padding: 3rem 0;' },
        el('div', { class: 'wrap' },
          el('div', { class: 'section-heading-row' },
            el('h2', { class: 'section-h2' }, 'Education')
          ),
          el('div', { class: 'timeline-stack' }, ...items)
        )
      );
    }

    function renderContact() {
      const actions = [];
      if (DATA.contact.email) {
        actions.push(el('a', { href: `mailto:${DATA.contact.email}`, class: 'glass-icon-btn', style: 'background: var(--accent); color: #08080a; font-weight: 700;' }, `✉ Send Email`));
      }
      if (DATA.links.github) {
        actions.push(el('a', { href: DATA.links.github, target: '_blank', class: 'glass-icon-btn' }, 'GitHub ↗'));
      }
      if (DATA.links.linkedin) {
        actions.push(el('a', { href: DATA.links.linkedin, target: '_blank', class: 'glass-icon-btn' }, 'LinkedIn ↗'));
      }

      return el('section', { id: 'contact' },
        el('div', { class: 'wrap' },
          el('div', { class: 'contact-glass-hero' },
            el('h2', { class: 'contact-h2' }, "Let's work together"),
            el('p', { class: 'contact-sub' },
              "I am actively considering high-impact technical roles, consulting opportunities, and innovative open source collaborations."
            ),
            actions.length ? el('div', { style: 'display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;' }, ...actions) : null
          )
        )
      );
    }

    function renderFooter() {
      return el('footer', { class: 'dark-footer' },
        el('div', { class: 'wrap footer-row' },
          el('div', {}, `© ${new Date().getFullYear()} ${DATA.name}`),
          el('div', {}, 'Built with Dark Minimalist theme.')
        )
      );
    }

    function render() {
      const app = document.getElementById('app');
      app.appendChild(renderNav());
      app.appendChild(renderHero());

      const marquee = renderMarquee();
      if (marquee) app.appendChild(marquee);

      const proj = renderProjects();
      if (proj) app.appendChild(proj);

      const exp = renderExperience();
      if (exp) app.appendChild(exp);

      const edu = renderEducation();
      if (edu) app.appendChild(edu);

      app.appendChild(renderContact());
      app.appendChild(renderFooter());
    }

    render();

    // Smooth In-Page Anchor Navigation
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const id = this.getAttribute('href').slice(1);
        if (!id) return;
        const target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (history.pushState) history.pushState(null, '', '#' + id);
        }
      });
    });
  </script>
</body>
</html>
